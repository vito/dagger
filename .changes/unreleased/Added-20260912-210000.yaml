kind: Added
body: |
  New `GitRepository.withRemote(name, url, pushUrls: [])` API registers named
  remotes on a repository, replacing the internal push-routing field. Registered
  remotes are recorded in checkouts materialized from the repository
  (`GitRef.tree`, `Workspace.git.directory`), so remote-aware tooling like `gh`
  can resolve and fetch from them, and the `origin` remote's push URLs route
  `push` when no explicit destination is given. Engine-local repository rebuilds
  now also carry the source repository's entire remote configuration, not just
  `origin`. Remotes are routing metadata only, never a credential grant.
